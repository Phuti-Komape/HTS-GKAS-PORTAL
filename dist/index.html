<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HTS &amp; GKAS Student Residence Portal</title>
  <meta name="description" content="Accredited South African student residence management portal for HTS Stonehenge &amp; GKAS Sonheuwel accommodation.">
  <meta name="theme-color" content="#0b192c">

  <!-- Progressive Web App (PWA) Manifest & Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="GKAS Residence">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GKAS Residence">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-CvavoH6R.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-D26LmYml.css">
</head>
<body>
  <!-- Accessibility Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main residence content</a>
  
  <!-- Screen Reader Live Region -->
  <div id="live-region" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap"></div>

  <!-- ═══════════════════════════════════════════════════════════
       1. AUTHENTICATION / NSFAS REGISTRATION PAGE
  ═══════════════════════════════════════════════════════════════ -->
  <div id="login-page">
    <!-- Populated dynamically by authView.js -->
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       2. AUTHENTICATED PORTAL SHELL
  ═══════════════════════════════════════════════════════════════ -->
  <div id="app" class="hidden">
    <!-- Mobile Drawer Backdrop -->
    <div class="drawer-backdrop" id="drawer-backdrop" onclick="closeMobileMenu()" aria-hidden="true"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar" aria-label="Main Navigation">
      <button class="sb-toggle" id="sb-toggle" onclick="toggleSidebar()" aria-label="Collapse Navigation" aria-expanded="true">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 2L3 6l4 4"/></svg>
      </button>

      <div class="sb-logo">
        <div class="sb-logo-badge" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div class="sb-logo-text">
          <div class="sb-logo-title">HTS · GKAS</div>
          <div class="sb-logo-sub">Student Residences</div>
        </div>
      </div>

      <div class="sb-role-badge">
        <div class="sb-role-lbl" id="sb-role-lbl">Role</div>
        <div class="sb-role-name" id="sb-role-name">User</div>
      </div>

      <!-- Navigation Links Container -->
      <nav id="sidebar-nav" aria-label="Portal Navigation Sections"></nav>

      <!-- Sidebar User Footer -->
      <div class="sb-footer">
        <div class="sb-avatar" id="sb-av">??</div>
        <div class="sb-user-info">
          <div class="sb-uname" id="sb-uname">User</div>
          <div class="sb-urole" id="sb-urole">Role</div>
        </div>
        <button class="sb-logout-btn" onclick="doLogout()" aria-label="Sign Out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main Workspace -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="openMobileMenu()" aria-label="Open Navigation Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="tb-titles">
            <div class="breadcrumb" id="breadcrumb">Portal / Dashboard</div>
            <h1 class="page-title" id="page-title">Executive Dashboard</h1>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Role preview switcher container -->
          <div id="role-quick-switch-container"></div>

          <!-- PWA Install Button -->
          <button id="pwa-install-btn" class="btn btn-outline btn-xs" onclick="window.installPwa()" style="display:none;align-items:center;gap:6px;font-weight:700;color:var(--gold);border-color:var(--gold);background:rgba(200,147,58,0.1);padding:6px 12px;border-radius:20px;cursor:pointer" title="Install GKAS Residence App to Home Screen">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Install App</span>
          </button>

          <!-- Notification Bell Button -->
          <button class="icon-btn" onclick="toggleNotif()" aria-label="Notifications" id="notif-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <div class="badge-dot" aria-hidden="true"></div>
          </button>
        </div>
      </header>

      <!-- Main Dynamic Content Container -->
      <main id="main-content"></main>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════
       3. NOTIFICATION OVERLAY PANEL
  ═══════════════════════════════════════════════════ -->
  <div class="notif-overlay" id="notif-overlay" onclick="if(event.target===this)toggleNotif()" role="dialog" aria-modal="true" aria-label="Notifications">
    <div class="notif-panel">
      <div class="notif-hd">
        <div class="notif-ttl">Residence Notices &amp; Updates</div>
        <button class="btn btn-ghost btn-xs" onclick="toggleNotif();showToast('✓','All notifications marked as read.','info')">Mark read</button>
      </div>
      <div class="notif-body" id="notif-items-list" role="list"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════
       4. ACCESSIBLE DIALOG MODAL
  ═══════════════════════════════════════════════════ -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-ttl">
    <div class="modal" id="modal" onclick="event.stopPropagation()">
      <div class="modal-hd">
        <h2 class="modal-ttl" id="modal-ttl">Dialog Title</h2>
        <button class="modal-close" onclick="closeModal()" aria-label="Close dialog">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════
       5. FLOATING TOAST NOTIFICATION
  ═══════════════════════════════════════════════════ -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast-icon" id="toast-icon">ℹ</span>
    <span class="toast-msg" id="toast-msg">Notification alert</span>
    <button class="toast-close" onclick="closeToast()" aria-label="Dismiss">×</button>
  </div>

  <!-- Module Script -->
</body>
</html>
